<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jquery Event Control Practice</title>
    <link rel="stylesheet" href="style.css">
    <script src="jquery.min.js"></script>
    <a href="index.html">الرجوع إلى الصفحة الأولى</a>
</head>
<body>

    
    <div class="image-container">
        <img id="my_image" src="cristiano-ronaldo.jpg" alt="Practice Image" style="width: 250px; border-radius: 8px;">
    </div>

    
    <div class="buttons-group">
        <button type="button" id="btn_fade_in">Fade In</button>
        <button type="button" id="btn_fade_out">Fade Out</button>
        <button type="button" id="btn_slide_up">Slide Up</button>
        <button type="button" id="btn_slide_down">Slide Down</button>
        <button type="button" id="btn_fade_toggle">Fade Toggle</button>
        <button type="button" id="btn_slide_toggle">Slide Toggle</button>
        <button type="button" id="btn_fade_to">Fade To</button>
    </div>

  
    <script>
        $(document).ready(function() {

            
            $('#btn_fade_in').click(function() {
                $('#my_image').fadeIn(1000); 
            });

           
            $('#btn_fade_out').click(function() {
                $('#my_image').fadeOut(1000);
            });

            
            $('#btn_slide_up').click(function() {
                $('#my_image').slideUp(1000);
            });

          
            $('#btn_slide_down').click(function() {
                $('#my_image').slideDown(1000);
            });

          
            $('#btn_fade_toggle').click(function() {
                $('#my_image').fadeToggle(1000);
            });

           
            $('#btn_slide_toggle').click(function() {
                $('#my_image').slideToggle(1000);
            });

           
            $('#btn_fade_to').click(function() {
                $('#my_image').fadeTo(1000, 0.6); 
            });

        });
    </script>
</body>
</html>
